[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.21"
evm_version = "shanghai"  # Default EVM version set to Shanghai
fs_permissions = [
    { access = "read-write", path = "./logs"},
    { access = "read", path = "./.env" },
    { access = "read-write", path = "./logs/reserves.json" }
]
ffi = true
verbosity = 3

[profile.mainnet]
evm_version = "shanghai"

[profile.arbitrum]
evm_version = "shanghai"

[profile.optimism]
evm_version = "shanghai"

[profile.base]
evm_version = "shanghai"

[profile.polygon]
evm_version = "shanghai"

[profile.avalanche]
evm_version = "shanghai"

[profile.gnosis]
evm_version = "shanghai"

[profile.bnb]
evm_version = "shanghai"

[profile.scroll]
evm_version = "shanghai"

[profile.metis]
evm_version = "shanghai"

[profile.plasma]
evm_version = "shanghai"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
arbitrum = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
optimism = { key = "${OPTIMISM_API_KEY}", url = "https://api-optimistic.etherscan.io/api" }
base = { key = "${BASE_API_KEY}", url = "https://api.basescan.org/api" }
polygon = { key = "${POLYGONSCAN_API_KEY}", url = "https://api.polygonscan.com/api" }
avalanche = { key = "${SNOWTRACE_API_KEY}", url = "https://api.snowtrace.io/api" }
gnosis = { key = "${GNOSISSCAN_API_KEY}", url = "https://api.gnosisscan.io/api" }
bnb = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api" }
scroll = { key = "${SCROLLSCAN_API_KEY}", url = "https://api.scrollscan.com/api" }
metis = { key = "${METISSCAN_API_KEY}", url = "https://andromeda-explorer.metis.io/api" }
plasma = { key = "${PLASMA_API_KEY}", url = "https://plasmascan.to/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options